services:
  - type: web
    name: sentineliq
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_ENV
        value: production
      - key: APP_STORAGE
        value: memory
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sentineliq_risk_intelligence
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ENABLE_DEMO_USERS
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: API_BASE_URL
        value: "/api/v1"
