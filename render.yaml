services:
  - type: web
    name: sentineliq-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt || pip install ."
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_STORAGE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sentineliq_risk_intelligence
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ENABLE_DEMO_USERS
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://sentineliq.vercel.app","http://localhost:8000"]'
      - key: API_BASE_URL
        value: "https://sentineliq-backend.onrender.com/api/v1"
