{% extends "base.html" %}

{% block title %}SentinelIQ | Authentication{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="panel" style="box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); padding: 1.75rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-mark" style="width: 44px; height: 44px; font-size: 20px; margin: 0 auto 0.75rem auto; border-radius: var(--radius-sm);">S</div>
      <h2 style="font-size: 18px; font-weight: 700; color: var(--text-primary); margin: 0;">SentinelIQ Sign In</h2>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 0.25rem;">Explainable Risk. Traceable Decisions.</p>
    </div>

    {% if error %}
    <div style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 0.65rem 0.85rem; border-radius: var(--radius-xs); font-size: 12px; margin-bottom: 1rem;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div style="margin-bottom: 0.85rem;">
        <label style="display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.3rem;">Username</label>
        <input type="text" id="username" name="username" class="input-control" style="width: 100%; font-size: 13px;" required placeholder="e.g. admin, analyst, compliance">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.3rem;">Password</label>
        <input type="password" id="password" name="password" class="input-control" style="width: 100%; font-size: 13px;" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 13px; padding: 0.6rem;">
        Sign In to Platform &rarr;
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
      <div style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.5rem; text-align: center;">
        Quick Fill Demo Accounts
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;">
        <button type="button" class="btn btn-secondary btn-sm" style="font-size: 11px;" onclick="setDemo('admin', 'SentinelIQ@Admin2026!')">
          Admin
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size: 11px;" onclick="setDemo('analyst', 'SentinelIQ@Analyst2026!')">
          Analyst
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size: 11px;" onclick="setDemo('compliance', 'SentinelIQ@Compliance2026!')">
          Compliance
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="font-size: 11px;" onclick="setDemo('readonly', 'SentinelIQ@ReadOnly2026!')">
          Read Only
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function setDemo(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
