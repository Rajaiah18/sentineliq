{% extends "base.html" %}

{% block title %}SentinelIQ | Authentication{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="panel-card" style="box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-logo-mark" style="width: 48px; height: 48px; font-size: 24px; margin: 0 auto 0.75rem auto;">S</div>
      <h2 style="font-size: 20px; font-weight: 700; color: #ffffff;">SentinelIQ Sign In</h2>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 0.25rem;">Explainable Risk. Traceable Decisions.</p>
    </div>

    {% if error %}
    <div style="background-color: var(--severity-critical-bg); border: 1px solid var(--severity-critical-border); color: var(--severity-critical-text); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 1rem;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Username</label>
        <input type="text" id="username" name="username" class="input-text" style="width: 100%;" required placeholder="e.g. admin, analyst, compliance">
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
        <input type="password" id="password" name="password" class="input-text" style="width: 100%;" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.65rem;">
        Sign In to SentinelIQ
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle);">
      <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.5rem; text-align: center;">
        Quick Fill Demo Accounts (Development Review)
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('admin', 'SentinelIQ@Admin2026!')">
          Admin
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('analyst', 'SentinelIQ@Analyst2026!')">
          Analyst
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('compliance', 'SentinelIQ@Compliance2026!')">
          Compliance
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('readonly', 'SentinelIQ@ReadOnly2026!')">
          Read Only
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function setDemo(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
